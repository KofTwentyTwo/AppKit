# NuGet package release for a KofTwentyTwo repository (K22-CI-30, K22-REL-*).
# Copy to .github/workflows/release.yml. Pushing a protected v* tag builds, tests,
# packs, generates SBOMs, attests, and publishes the GitHub release through the shared
# reusable workflow, then pushes the packages to nuget.org.
#
# nuget.org trusted publishing (one-time owner setup, no API key stored anywhere):
#   nuget.org → your profile → Trusted Publishing → Add policy:
#     Repository Owner: KofTwentyTwo
#     Repository:       AppKit
#     Workflow File:    release.yml        (THIS file's name, not the reusable workflow's)
#     Environment:      release
#   then set the repository variable NUGET_USER to your nuget.org profile name.
# The publish job must stay in this file: nuget.org checks that the OIDC token's
# job_workflow_ref belongs to this repository, which a job inside the reusable
# workflow (in KofTwentyTwo/standards) can never satisfy.
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

# One release at a time, and never cancel one halfway through publishing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: Checkout main and tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require NuGet publishing configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: test -n "$NUGET_USER"
      - name: Require signing integration before publishing another release
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          ARTIFACT_SIGNING_SUBJECT: ${{ vars.ARTIFACT_SIGNING_SUBJECT }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Select-String -LiteralPath .github/workflows/release.yml -Pattern '^\s+sign: true\s*$' -Quiet))
          {
             throw 'Release signing is required. Publish the prepared standards signing change, update the shared builder pin, and configure sign: true. See docs/release-signing.md.'
          }
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'ARTIFACT_SIGNING_ENDPOINT', 'ARTIFACT_SIGNING_ACCOUNT', 'ARTIFACT_SIGNING_PROFILE', 'ARTIFACT_SIGNING_SUBJECT'))
          {
             if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing verified signing variable: $name" }
          }

  gates:
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  security:
    needs: verify
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  codeql:
    needs: verify
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  review-tests:
    name: review / tests
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test review validation
        run: node --test .github/scripts/review-gate.test.cjs

  scripts:
    needs: verify
    uses: ./.github/workflows/scripts.yml
    permissions:
      contents: read

  mutation:
    needs: verify
    uses: ./.github/workflows/mutation.yml
    permissions:
      contents: read

  release:
    needs: [verify, gates, security, codeql, review-tests, scripts, mutation]
    uses: KofTwentyTwo/standards/.github/workflows/release-nuget.yml@fdf5ed029603c938615a32b1beca3628b8787945 # v0.1.2
    permissions:
      contents: write      # create and publish the GitHub release
      id-token: write      # sign attestations
      attestations: write  # store attestations
    with:
      solution: AppKit.slnx
      platform: x64
      coverage-packages: KofTwentyTwo.AppKit,KofTwentyTwo.AppKit.Updates
      test-projects: |
        tests/KofTwentyTwo.AppKit.Tests

  publish:
    name: publish (nuget.org)
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      attestations: read # verify the attestations before pushing
      id-token: write    # trusted publishing token exchange
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages

      # Push only bytes that the shared release workflow built and attested.
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          for package in packages/*.nupkg; do
            gh attestation verify "$package" --repo "$REPOSITORY" --signer-repo KofTwentyTwo/standards
          done

      - name: NuGet login (OIDC to a one-hour API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "packages/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
