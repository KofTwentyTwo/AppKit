# Blocks pull requests that add dependencies with known vulnerabilities or with
# licenses outside the allowlist below. Only dependencies *added or changed* by
# the PR are checked (via the GitHub dependency graph diff), so existing
# dependencies never retroactively fail this gate.
name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    # No build happens here, so the cheaper Linux runner is fine.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Needed for comment-summary-in-pr.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          # Fail on ANY known vulnerability, even low severity.
          fail-on-severity: low
          comment-summary-in-pr: on-failure
          # Anything not on this list fails the check. AppKit is MIT and is
          # consumed by MIT apps, so only permissive licenses are accepted.
          # Extend deliberately - a new license here is a legal decision, not a
          # build fix.
          allow-licenses: >-
            MIT,
            MIT-0,
            Apache-2.0,
            BSD-2-Clause,
            BSD-3-Clause,
            0BSD,
            ISC,
            MS-PL,
            Unlicense,
            CC0-1.0
