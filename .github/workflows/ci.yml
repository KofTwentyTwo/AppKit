# .NET build, test, coverage, and format gates (K22-CI-01, K22-CI-02, K22-TEST-10).
# Produces the required contexts `ci / build-test`, `ci / format`, and `ci / ui-tests`.
# The coverage gate holds the two UI-framework-free packages at 100% line coverage.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: KofTwentyTwo/standards/.github/workflows/dotnet.yml@ae3df7af77e5a97df231a9f53be9d8ed785ddce5 # main (pre-release)
    permissions:
      contents: read # check out, build, and test; nothing is written
    with:
      solution: AppKit.slnx
      platform: x64
      coverage-packages: KofTwentyTwo.AppKit,KofTwentyTwo.AppKit.Updates
      test-projects: |
        tests/KofTwentyTwo.AppKit.Tests
      ui-test-projects: |
        tests/KofTwentyTwo.AppKit.UiTests
      pack: true
